<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.seo_title %}{{ page.seo_title | escape }}{% elsif page.title %}{{ page.title | escape }} | FluenteMente{% else %}FluenteMente | Inglese per la vita reale{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | escape }}{% else %}{{ site.description | escape }}{% endif %}" />
  {% if site.launch_mode %}
  <meta name="robots" content="noindex, nofollow" />
  {% else %}
  <meta name="robots" content="index, follow" />
  {% endif %}
  <meta name="theme-color" content="#1e3a5f" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <meta property="og:type" content="{% if page.url == '/' %}website{% else %}article{% endif %}" />
  <meta property="og:site_name" content="FluenteMente" />
  <meta property="og:title" content="{{ page.seo_title | default: page.title | default: site.title | escape }}" />
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="{{ '/assets/img/og-default.jpg' | absolute_url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.seo_title | default: page.title | default: site.title | escape }}" />
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | escape }}" />
  <meta name="twitter:image" content="{{ '/assets/img/og-default.jpg' | absolute_url }}" />
</head>
