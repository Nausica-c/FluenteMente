title: "FluenteMente"
description: "L’inglese per la vita reale: curiosità, spiegazioni pratiche e un metodo sostenibile."
url: "https://nausica-c.github.io"
baseurl: "/FluenteMente"
permalink: pretty

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Modalità di preparazione: il sito resta noindex fino alla revisione finale.
# Cambiare in false solo dopo aver validato pagine, privacy/cookie, analytics e link affiliati.
launch_mode: true

# File di lavoro editoriali e di pubblicazione: disponibili nel repository GitHub,
# ma esclusi dall'output del sito.
exclude:
  - README.md
  - DESIGN-SYSTEM.md
  - CHANGELOG.md
  - docs
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
