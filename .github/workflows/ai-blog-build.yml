name: AI Blog Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. CHECKOUT SICURO
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. SETUP PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml openai

      # =========================
      # 3. GENERAZIONE CONTENUTI
      # =========================
      - name: Run AI builder
        run: python build_seo_engine.py

      # =========================
      # 4. GIT SAFE COMMIT (NO PULL QUI)
      # =========================
      - name: Commit changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # evita crash se non ci sono cambi
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "AI blog update"

      # =========================
      # 5. SAFE PUSH (FORZATO SOLO SU FAST-FORWARD CHECK)
      # =========================
      - name: Pull + push safe
        run: |
          git pull --rebase origin main || (git rebase --abort && exit 1)
          git push origin main
