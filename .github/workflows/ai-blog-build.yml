name: AI Blog Build (V1 CLEAN)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. CHECKOUT (pulito)
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4

      # =========================
      # 2. SETUP PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # 3. INSTALL DEPS
      # =========================
      - name: Install dependencies
        run: pip install pyyaml

      # =========================
      # 4. RUN BUILDER
      # =========================
      - name: Build articles
        run: python build_seo_engine.py

      # =========================
      # 5. COMMIT ONLY IF CHANGES
      # =========================
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "AI blog update (V1 CLEAN)"

      # =========================
      # 6. PUSH SAFE
      # =========================
      - name: Push changes
        run: git push origin main
