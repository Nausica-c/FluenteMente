name: AI Blog Build V4

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-blog-v4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. CHECKOUT FULL HISTORY
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # 3. DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: pip install pyyaml openai

      # =========================
      # 4. BUILD ENGINE (WITH SECRETS)
      # =========================
      - name: Run AI engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python build_seo_engine.py

      # =========================
      # 5. CREATE CLEAN BRANCH
      # =========================
      - name: Create branch & commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="ai-build-v4"

          git checkout -B $BRANCH

          git add .

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "AI Blog Update V4"

          git push origin $BRANCH

      # =========================
      # 6. CREATE OR UPDATE PR (SAFE)
      # =========================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai-build-v4
          base: main
          title: "AI Blog Update V4"
          body: |
            Automated SEO blog generation update.

            - Cluster-based content
            - Internal linking optimized
            - AI-generated articles

          delete-branch: true
