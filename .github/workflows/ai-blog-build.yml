name: AI Blog Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-blog-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml openai

      # 🔥 PULL PRIMA DI GENERARE (evita conflict)
      - name: Sync with remote
        run: |
          git pull origin main --rebase || true

      - name: Run AI builder
        run: python build_seo_engine.py

      # 🔥 COMMIT SAFE (NO FORCE PUSH)
      - name: Commit & Push safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "AI blog update" || echo "no changes"

          git push origin HEAD:main
