name: AI Blog Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml openai

      - name: Run AI builder
        run: python build_seo_engine.py

      # 🔥 SAFE COMMIT (NO FORCE, NO REBASE)
      - name: Commit & Push safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _posts _data

          git commit -m "AI blog update" || echo "no changes"

          git pull origin main --no-rebase || true

          git push origin main
