name: AI Blog Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml openai

      - name: Run AI builder
        run: python build_seo_engine.py

      # 🔥 VERSIONE CORRETTA (NO CONFLICT)
      - name: Commit & Force Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 🔥 elimina vecchi post (evita duplicati + conflitti)
          git rm -r _posts || true

          git add .

          git commit -m "AI blog rebuild" || echo "no changes"

          # 🔥 NIENTE pull / rebase
          git push origin main --force
