name: AI Blog Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml openai

      # 🔥 STEP 1: GENERAZIONE PRIMA DI GIT OPS
      - name: Run AI builder
        run: python build_seo_engine.py

      # 🔥 STEP 2: Sync sicuro dopo generazione
      - name: Sync with remote safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "AI blog update" || echo "no changes"

          git pull origin main --no-rebase || echo "no remote changes"

      # 🔥 STEP 3: PUSH SAFE
      - name: Push changes
        run: git push origin main
