name: AI Blog Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml openai

      - name: Run AI builder
        run: python build_seo_engine.py

      # 🔥 FIX 1: evita conflitti (pull prima di commit)
      - name: Sync with remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      # 🔥 FIX 2: commit solo se serve
      - name: Commit changes
        run: |
          git add .
          git diff --cached --quiet && echo "No changes" || git commit -m "AI blog update"

      # 🔥 FIX 3: push safe (NO FORCE)
      - name: Push safely
        run: |
          git push origin main
