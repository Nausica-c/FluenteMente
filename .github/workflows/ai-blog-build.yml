name: AI Blog Build V3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-blog-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. CHECKOUT
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. SETUP PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # 3. DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: pip install pyyaml openai

      # =========================
      # 4. BUILD CONTENT
      # =========================
      - name: Build SEO engine
        run: python build_seo_engine.py

      # =========================
      # 5. SWITCH TO AI BRANCH
      # =========================
      - name: Commit to AI branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="ai-build"

          git checkout -B $BRANCH

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "AI blog update (V3)"

          git push origin $BRANCH --force

      # =========================
      # 6. CREATE PR AUTOMATICO
      # =========================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai-build
          base: main
          title: "AI Blog Update (V3)"
          body: "Auto-generated SEO articles update"
          delete-branch: false
