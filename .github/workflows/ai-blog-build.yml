name: AI Blog Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🔥 IMPORTANTISSIMO per evitare problemi di push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml openai

      - name: Run AI builder
        run: python build_seo_engine.py

      # 🔥 FIX PRINCIPALE (ANTI CONFLICT)
      - name: Commit & Push safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "AI blog update" || echo "no changes"

          git pull --rebase origin main

          git push
