name: AI Blog Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔥 FIX 1: prima sync pulito
      - name: Sync repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml openai

      # 🔥 SOLO ORA generi contenuti
      - name: Run AI builder
        run: python build_seo_engine.py

      # 🔥 FIX 2: commit sicuro
      - name: Commit changes
        run: |
          git add .
          git diff --cached --quiet && echo "No changes" || git commit -m "AI blog update"

      # 🔥 FIX 3: push semplice
      - name: Push
        run: git push origin main
