name: SEO Engine Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. CHECKOUT STABILE
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. SYNC CON REMOTE (CRITICO)
      # =========================
      - name: Sync with remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || (git rebase --abort && exit 1)

      # =========================
      # 3. PYTHON SETUP
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =========================
      # 4. DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: pip install pyyaml openai

      # =========================
      # 5. RUN ENGINE
      # =========================
      - name: Run SEO engine
        run: python build_seo_engine.py

      # =========================
      # 6. COMMIT SAFE
      # =========================
      - name: Commit changes
        run: |
          git add .
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto SEO publish"

      # =========================
      # 7. PUSH SAFE
      # =========================
      - name: Push changes
        run: |
          git push origin main
