name: SEO Engine Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run SEO engine
        run: |
          python build_seo_engine.py

      - name: Commit generated file
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add _data/articles-linked.yml
          git commit -m "Auto SEO build" || echo "No changes"
          git push
