name: SEO Engine Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 🔴 FIX FONDAMENTALE

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # 🔴 importante

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run SEO engine
        run: |
          python build_seo_engine.py

      - name: Commit generated file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/articles-linked.yml

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto SEO build"
          git push
