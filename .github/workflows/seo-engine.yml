name: SEO Engine Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 🔥 QUESTO RISOLVE IL 403

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run SEO engine
        run: python build_seo_engine.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto SEO publish" || echo "No changes"
          git push
