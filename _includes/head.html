<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}
  </title>

  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}" />

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- OPEN GRAPH -->
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />

  <!-- TWITTER -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- SCHEMA BASIC -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}"
  }
  </script>

  <!-- ANALYTICS -->
  <script data-goatcounter="https://fluente-mente.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BRKW4G7PH8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BRKW4G7PH8');
  </script>

</head>
