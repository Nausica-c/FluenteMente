<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {% if page.title %}{{ page.title }} | FluenteMente{% else %}FluenteMente | Impara le lingue in modo semplice{% endif %}
  </title>

  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}Impara inglese e lingue straniere con un metodo semplice, pratico e sostenibile da 10-15 minuti al giorno.{% endif %}" />

  <!-- SEO -->
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#111827" />

  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

  <!-- OPEN GRAPH -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="FluenteMente" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="{{ '/assets/img/og-default.jpg' | relative_url }}" />

  <!-- TWITTER -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
  <meta name="twitter:description" content="{{ page.description | default: site.description }}" />

  <!-- SCHEMA SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "FluenteMente",
    "url": "{{ site.url }}",
    "description": "Metodo semplice per imparare lingue in modo pratico"
  }
  </script>

  <!-- ANALYTICS -->
  <script data-goatcounter="https://fluente-mente.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BRKW4G7PH8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BRKW4G7PH8');
  </script>

</head>
