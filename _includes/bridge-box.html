<div class="bridge-box {{ include.class | default: '' }}">
  <h3 class="bridge-title">
    {{ include.title | default: "💡 Non hai tempo per organizzare lo studio?" }}
  </h3>
  
  <p class="bridge-text">
    {{ include.text | default: "Il problema del fai-da-te è che perdi tempo a cercare cosa studiare invece di imparare davvero." }}
  </p>

  <a href="{{ include.link_url | default: '/recensione/babbel/' | relative_url }}" 
     class="bridge-link"
     {% if include.target %}target="{{ include.target }}" rel="noopener"{% endif %}>
    {{ include.link_text | default: "Scopri perché Babbel è efficace. →" }}
  </a>
</div>
