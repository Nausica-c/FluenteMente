<div class="section-in-breve {{ include.class | default: '' }}">
  <div class="sib-header">
    <span class="sib-icon">{{ include.icon | default: "🎯" }}</span>
    <h3 class="sib-title">{{ include.title | default: "In breve:" }}</h3>
  </div>

  <ul class="sib-list">
    {% for i in (1..5) %}
      {% capture p %}p{{ i }}{% endcapture %}
      {% if include[p] %}<li>{{ include[p] }}</li>{% endif %}
    {% endfor %}
  </ul>
</div>
