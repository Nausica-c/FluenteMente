<div class="summary-block section-in-breve {{ include.class }}">
  <h3>{{ include.title | default: "🎯 In breve" }}</h3>

  <ul class="summary-list">
    {% for i in (1..5) %}
      {% capture p %}p{{ i }}{% endcapture %}
      {% if include[p] %}
        <li>{{ include[p] }}</li>
      {% endif %}
    {% endfor %}
  </ul>
</div>
