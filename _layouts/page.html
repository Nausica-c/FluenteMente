---
layout: default
---
<article class="post-wrapper">
  
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {% if page.subtitle %}
      <p class="post-meta" style="font-size: 1.1rem; max-width: 60ch; margin: 10px auto 0;">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  {% include affiliate-disclosure.html %}

  <div class="post-content">
    {{ content }}
  </div>

</article>
